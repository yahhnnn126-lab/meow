<!DOCTYPE html>
<html>
<head>
<title>My Personal Website</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
background: linear-gradient(135deg,#6a11cb,#2575fc);
color:white;
text-align:center;
}

header{
padding:40px;
}

.profile{
width:160px;
height:160px;
border-radius:50%;
border:4px solid white;
object-fit:cover;
}

section{
background:white;
color:black;
margin:25px;
padding:25px;
border-radius:12px;
box-shadow:0 6px 12px rgba(0,0,0,0.2);
}

.gallery img{
width:170px;
margin:10px;
border-radius:10px;
transition:transform 0.3s;
}

.gallery img:hover{
transform:scale(1.1);
}

button{
padding:12px 20px;
font-size:16px;
border:none;
border-radius:6px;
background:#2575fc;
color:white;
cursor:pointer;
}

button:hover{
background:#1a5ed8;
}

footer{
margin-top:20px;
padding:15px;
font-size:14px;
}

</style>

</head>

<body>

<header>

<!-- CHANGE THIS PHOTO -->
<img src="myphoto.jpg" class="profile">

<h1>Hi! I'm Marianne</h1>
<p>Welcome to my personal website</p>

</header>

<section>

<h2>About Me</h2>
<p>Hello! I'm a student who video games, news writing, sports,and learning about technology and coding.</p>

</section>

<section>

<h2>My Designs</h2>

<div class="gallery">

<!-- ADD YOUR DESIGN PHOTOS HERE -->
<img src="design1.jpg">
<img src="design2.jpg">
<img src="design3.jpg">

</div>

</section>

<section>

<h2>Say Hello!</h2>

<button onclick="hello()">Click Me</button>

</section>

<footer>
<p>© 2026 My Personal Website</p>
</footer>

<script>

function hello(){
alert("Hello! Thanks for visiting my website!");
}

</script>

</body>
</html>
